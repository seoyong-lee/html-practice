    <title>연습: 텍스트 태그 (모범답안)</title>

  <body>
    <h1>이달의 책 소개</h1>

    <h2>작은 서점의 하루</h2>
    <p>동네 서점 주인의 하루를 따라가는 에세이입니다.</p>
    <p>아침 열 시, 문을 열기 전에 책을 정리하는 장면으로 시작합니다.</p>

    <p><strong>안내:</strong> 북클럽은 시작 10분 전까지 <em>꼭</em> 도착해 주세요.</p>

    <blockquote>
      <p>책을 파는 일은 시간을 건네는 일이다.</p>
    </blockquote>

    <p>제목 색은 <code>color</code> 속성으로 바꿉니다.</p>
    <pre><code>h1 {
      color: green;
    }</code></pre>

    <p>
      서울시 숲속로 12<br />
      2층 숲속 책방
    </p>
  </body>
