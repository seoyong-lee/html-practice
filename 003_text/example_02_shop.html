<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예제 (2) 쇼핑몰 상품 상세 페이지</title>
    <!--
      실전 예제 (2) — 쇼핑몰 상품 상세 페이지
      article · h1 · strong · del · ins · mark · em
      del(삭제·정가) · ins(삽입·할인가) · mark(강조·할인율)
    -->
  </head>
  <body>
    <article>
      <h1>프리미엄 무선 이어폰</h1>
      <p>
        <strong>할인가:</strong>
        <del>129,000원</del>
        <ins>99,000원</ins>
        <mark>23% 할인</mark>
      </p>

      <h2>주의사항</h2>
      <p>제품은 <em>방수</em> 기능을 지원하지 않습니다.</p>
    </article>
  </body>
</html>
