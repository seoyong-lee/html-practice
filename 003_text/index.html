<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연습: 텍스트 태그</title>
    <!--
      ========== 연습 요구사항 — 003_text (실습 2 · 3분) ==========
      책 소개 페이지에 제목·문단·강조·인용·코드 태그를 넣으세요.

      1. h1: "이달의 책 소개"
      2. h2: "작은 서점의 하루"
      3. p 두 개: 책 소개 문장은 자유롭게
      4. p 안에 strong "안내:", em "꼭" 사용
         예) 안내: 북클럽은 시작 10분 전까지 꼭 도착해 주세요.
      5. blockquote 안에 p로 인용문
         예) 책을 파는 일은 시간을 건네는 일이다.
      6. p 안에 code "color" (속성 이름)
      7. pre 안에 code: 줄바꿈과 들여쓰기 유지
         예) h1 { color: green; }
      8. 주소처럼 줄바꿈 자체가 의미 있는 곳: br 사용
         예) 서울시 숲속로 12 / 2층 숲속 책방

      [함정] pre 안 코드를 에디터가 자동 들여쓰기로 밀면
      화면에도 그대로 밀려 보입니다. pre는 적은 그대로 보여 줍니다.

      참고 예제: example_01_blog.html · example_02_shop.html · example_03_tech.html
      다 한 사람은 solution.html과 비교하세요.
    -->

</html>
