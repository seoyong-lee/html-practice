<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예제 (3) 기술 문서</title>
    <!--
      실전 예제 (3) — 기술 문서
      article · abbr · ol/li · strong · pre/code · mark · code
    -->
  </head>
  <body>
    <article>
      <h1>CSS 박스 모델 이해하기</h1>
      <p>
        <abbr title="Cascading Style Sheets">CSS</abbr>의 박스 모델은
        요소를 Content, Padding, Border, Margin 네 층으로 설명합니다.
      </p>
      <ol>
        <li><strong>Content</strong> - 내용</li>
        <li><strong>Padding</strong> - 내부 여백</li>
      </ol>
      <pre><code>.box { width: 300px; }</code></pre>
      <p>
        <mark>중요:</mark> <code>width</code>는 Content 영역의 크기만
        지정합니다.
      </p>
    </article>
  </body>
</html>
