<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연습: 리스트 (모범답안)</title>
  </head>
  <body>
    <h2>북클럽 진행 순서</h2>
    <ol>
      <li>자기소개</li>
      <li>책 소개</li>
      <li>함께 읽기</li>
      <li>이야기 나누기</li>
      <li>다음 책 정하기</li>
    </ol>

    <h2>책방 메뉴</h2>
    <ul>
      <li>소설</li>
      <li>에세이</li>
      <li>그림책</li>
      <li>인문</li>
    </ul>

    <h2>책방 용어</h2>
    <dl>
      <dt>독립출판</dt>
      <dd>작가가 기획부터 인쇄까지 직접 하는 출판</dd>
      <dt>큐레이션</dt>
      <dd>주제를 정해 책을 골라 두는 일</dd>
    </dl>
  </body>
</html>
