<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연습: 다른 코드 불러오기</title>
    <!--
      ========== 연습 요구사항 ==========
      head 안에 link, script 태그를 넣으세요.
      (css, js 폴더와 favicon.ico가 들어 있어서 결과를 바로 확인할 수 있습니다.)

      1. link: rel="stylesheet" href="css/style.css" → 제목이 초록색이 되면 성공
      2. link: rel="icon" href="favicon.ico" type="image/x-icon" → 탭에 책 아이콘
      3. script: src="js/main.js" defer
      4. body 끝(</body> 바로 앞)에 script src="js/analytics.js" async
      5. 개발자 도구(F12) → Console 탭에서 두 파일이 찍은 문장을 확인하세요.
    -->
  </head>
  <body>
    <h1>외부 CSS와 JS 연결</h1>
    <p>
      head에 style.css, favicon, main.js(defer)를 넣고 body 끝에
      analytics.js(async)를 넣으세요.
    </p>
    <!-- script async는 여기 -->
  </body>
</html>
