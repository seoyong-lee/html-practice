<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연습: 의미있는 HTML</title>
    <!--
      ========== 연습 요구사항 ==========
      head에 메타 정보를, body에 시맨틱 태그로 구조를 완성하세요.

      [ head ]
      1. meta name="description" content="매달 한 권을 함께 읽는 동네 책방, 숲속 책방입니다."
      2. meta property="og:title" content="숲속 책방"
      3. meta name="viewport" (이미 있음)

      [ body - 시맨틱 구조 ]
      1. header 안에 h1 "숲속 책방 블로그", nav 안에 a href="#" "홈" "이달의 책" "북클럽"
      2. main 안에 article, article 안에 h2 "작은 서점의 하루를 읽고", p "서점 주인의 하루를 따라갑니다."
      3. aside 안에 h3 "인기 글", ul/li a href="#" "가을에 읽기 좋은 시집" "그림책 고르는 법"
      4. footer 안에 p "© 2026 숲속 책방. All rights reserved."
    -->
  </head>
  <body>
    <!-- 여기에 header, main(article), aside, footer로 작성하세요. -->
  </body>
</html>
