<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연습: 링크</title>
    <!--
      ========== 연습 요구사항 ==========
      아래에 a 태그로 여러 가지 링크를 만드세요.

      1. 절대 주소: href="https://www.nl.go.kr" → "국립중앙도서관"
      2. 상대 주소: href="about.html" → "책방 소개" (같은 폴더의 about.html)
      3. 페이지 안 이동: 목적지 section에 id="bookclub"을 붙인 뒤 a에 href="#bookclub" → "북클럽 안내로"
      4. 새 창: href="https://www.kyobobook.co.kr" target="_blank" rel="noopener noreferrer" → "교보문고 (새 창)"
      5. 맨 위로: href="#" → "맨 위로"
      6. 이메일: href="mailto:hello@forest-books.kr" → "문의 메일"
         (메일 프로그램이 설정되지 않은 컴퓨터에서는 눌러도 반응이 없을 수 있습니다)
      7. 전화: href="tel:02-1234-5678" → "전화 걸기"
    -->
  </head>
  <body>
    <nav>
      <!-- 1. 절대 주소 -->
      <!-- 2. 상대 주소 -->
      <!-- 3. 페이지 안 이동 링크 (아래 section으로) -->
    </nav>

    <p>새 창, 이메일, 전화 링크를 여기에 추가하세요.</p>

    <section>
      <h2>북클럽 안내</h2>
      <p>목차의 링크를 누르면 이 영역으로 이동해야 합니다.</p>
      <p style="height: 800px">매달 마지막 토요일 저녁 7시에 모입니다.</p>
    </section>

    <p><a href="#">맨 위로</a></p>
  </body>
</html>
